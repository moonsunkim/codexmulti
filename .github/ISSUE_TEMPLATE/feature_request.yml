name: Feature request
description: Propose an improvement to CodexMulti
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: Search existing issues before proposing a feature. For substantial work, discuss the scope here before opening a pull request.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem or limitation should CodexMulti address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the behavior you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any workarounds or alternative designs you considered.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots, examples, or constraints that would help evaluate the request.
